<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logística Flash</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="login-root"></div>

<div id="shell-root" class="app-shell" style="display:none">
  <div id="nav-root"></div>
  <div class="app-main" id="main-root"></div>
</div>

<div id="confirm-root"></div>
<div id="invoice-review-root"></div>
<div id="invoice-parsing-root"></div>

<script src="js/config.js"></script>
<!-- Recomendado: fijar la versión exacta en vez de "@2" (que es un rango y
     puede cambiar solo). Abre esta URL en el navegador, mira qué versión
     sirve, y reemplázala aquí — por ejemplo @2.58.0. Así una publicación
     nueva de Supabase no puede romper la app sin que ustedes lo decidan.
     Si el CDN falla, la app ahora muestra un mensaje claro en vez de
     quedarse en blanco (ver js/supabaseClient.js). -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/invoiceParser.js"></script>
<script src="js/app.js"></script>
</body>
</html>
